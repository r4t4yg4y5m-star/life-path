:root{--bg:#080d18;--panel:#111a2b;--panel2:#19263d;--blue:#3985ff;--text:#f2f5fb;--muted:#8996ad;--border:#26344c;--green:#36c98b;--red:#f06470;--gold:#e8b85d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:105px}
button,input,select{font:inherit}button{cursor:pointer}
header{padding:22px 17px 17px;background:linear-gradient(135deg,#101d34,#0b1221);border-bottom:1px solid var(--border)}
.logo{font-size:23px;font-weight:900;letter-spacing:2px}.logo span{color:var(--blue)}
.subtitle{font-size:11px;color:var(--muted);margin-top:5px;letter-spacing:.5px}
.container{padding:17px 15px;max-width:760px;margin:auto}
.card{background:var(--panel);border:1px solid var(--border);border-radius:19px;padding:16px;margin-bottom:14px}
.card h3{font-size:16px;margin:0 0 13px}
.muted{color:var(--muted)}.small{font-size:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.stat{background:var(--panel2);padding:13px;border-radius:13px}
.stat .value{font-size:19px;font-weight:850;margin-top:5px}
.stat .name{font-size:11px;color:var(--muted)}
button.primary,button.secondary,button.danger,button.ghost{border:0;border-radius:13px;padding:13px 14px;font-weight:800;transition:transform .15s,opacity .15s}
button:active{transform:scale(.97)}
button.primary{background:var(--blue);color:white}
button.secondary{background:#263650;color:white}
button.danger{background:#512a37;color:#ffb8c0}
button.ghost{background:transparent;border:1px solid var(--border);color:var(--text)}
button:disabled{opacity:.4;cursor:not-allowed}
.full{width:100%}
input,select{width:100%;background:#0b1424;border:1px solid var(--border);color:var(--text);border-radius:12px;padding:13px;margin:7px 0 13px;outline:none}
label{font-size:12px;color:var(--muted)}
.nav{position:fixed;bottom:0;left:0;right:0;z-index:5;display:flex;justify-content:space-around;gap:3px;padding:9px 3px calc(9px + env(safe-area-inset-bottom));background:#0d1627;border-top:1px solid var(--border)}
.nav button{flex:1;min-width:0;background:transparent;border:0;color:var(--muted);font-size:9px;padding:8px 1px;border-radius:13px}
.nav button.active{background:#1d3152;color:white;transform:translateY(-3px)}
.nav .nav-icon{display:block;font-size:20px;margin-bottom:5px}
.section-title{font-size:20px;font-weight:900;margin:5px 0 15px}
.big-age{font-size:42px;font-weight:900}
.progress{height:7px;background:#26344c;border-radius:20px;overflow:hidden;margin-top:9px}
.progress div{height:100%;background:var(--blue);border-radius:20px;transition:width .4s}
.tag{display:inline-block;padding:5px 9px;border-radius:8px;background:#213654;color:#a9cbff;font-size:10px;margin:2px}
.tag.green{background:#173c35;color:#8ce5c1}.tag.red{background:#482832;color:#ffb2bb}.tag.gold{background:#46391f;color:#f4d18a}
.item{padding:14px 0;border-bottom:1px solid var(--border)}.item:last-child{border:0}
.item-title{font-weight:800;font-size:15px}
.item-desc{font-size:12px;color:var(--muted);margin:6px 0 10px;line-height:1.55}
.notice{padding:13px;border-radius:12px;background:#17253c;color:#b9c9e3;font-size:12px;line-height:1.6;margin-bottom:13px}
.center{text-align:center}.hidden{display:none!important}
.metric-line{display:flex;align-items:baseline;flex-wrap:wrap;gap:6px}
.metric-name{color:var(--muted)}.metric-value{font-weight:850}
.event{border-left:3px solid var(--gold);padding:14px;background:#1b2030;border-radius:0 12px 12px 0;margin:10px 0}
.choice{display:flex;flex-direction:column;gap:8px;margin-top:12px}.choice button{text-align:left}
#app.page-enter{animation:pageIn .38s cubic-bezier(.2,.8,.2,1) both}
@keyframes pageIn{from{opacity:0;transform:translateY(18px);filter:blur(3px)}to{opacity:1;transform:translateY(0);filter:blur(0)}}
.toast-wrap{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:25px;background:rgba(0,0,0,.48);opacity:0;pointer-events:none;transition:opacity .25s}
.toast-wrap.show{opacity:1;pointer-events:auto}
.toast{width:100%;max-width:340px;background:#19263b;border:1px solid #354765;border-radius:20px;padding:22px;box-shadow:0 15px 50px #0008;transform:scale(.88) translateY(15px);transition:transform .3s}
.toast-wrap.show .toast{transform:scale(1) translateY(0)}
.toast-icon{width:44px;height:44px;border-radius:14px;background:#233d65;display:grid;place-items:center;font-size:22px;margin-bottom:14px}
.toast-title{font-size:17px;font-weight:850;margin-bottom:8px}
.toast-message{font-size:14px;line-height:1.55;color:#b9c6da}
.toast button{margin-top:18px}
.career-intro{padding:19px;border-radius:20px;background:linear-gradient(145deg,#172e50,#111a2b);border:1px solid #2a456a;margin-bottom:15px}
.career-intro-icon{width:45px;height:45px;border-radius:14px;display:grid;place-items:center;background:#284775;font-size:23px;margin-bottom:13px}
.career-intro-title{font-size:18px;font-weight:900;margin-bottom:7px}
.career-intro-text{font-size:12px;color:#aabbd4;line-height:1.6}
.career-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.career-category{min-width:0;text-align:left;position:relative;overflow:hidden;padding:14px 12px;border-radius:17px;border:1px solid var(--border);background:linear-gradient(145deg,#17243a,#101827);color:var(--text)}
.category-icon{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:#263b5b;font-size:20px;margin-bottom:13px}
.category-name{font-size:13px;font-weight:850;line-height:1.3}
.category-count{font-size:10px;color:var(--muted);margin-top:6px}
.category-arrow{position:absolute;right:12px;top:15px;color:#7894bb;font-size:17px}
.selected-category{border:1px solid #31517c;background:linear-gradient(145deg,#172d4b,#111a2b);border-radius:18px;padding:15px;margin-bottom:14px}
.selected-category-top{display:flex;align-items:center;gap:12px}
.selected-category-icon{width:43px;height:43px;border-radius:13px;background:#29466e;display:grid;place-items:center;font-size:22px}
.profession-card{background:#121e31;border:1px solid var(--border);border-radius:15px;padding:14px;margin-bottom:9px}
.profession-card button{font-size:12px}
.requirement{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:11px 0;border-bottom:1px solid var(--border);font-size:12px}
.requirement:last-child{border:0}
.requirement-name{color:var(--muted)}
.requirement-status{font-weight:800;text-align:right}
.requirement-status.ok{color:var(--green)}
.requirement-status.no{color:var(--red)}
.job-task{background:linear-gradient(145deg,#172b46,#111a2b);border:1px solid #2b4567;border-radius:15px;padding:14px;margin:10px 0}
.job-task h4{margin:0 0 7px;font-size:14px}
.job-task p{font-size:12px;line-height:1.5;color:var(--muted)}
.year-screen{animation:yearAppear .55s cubic-bezier(.2,.8,.2,1) both}

.year-hero{position:relative;overflow:hidden;text-align:center;padding:27px 18px 25px;border-radius:22px;background:linear-gradient(145deg,#18345d,#101b30 70%);border:1px solid #31517c;margin-bottom:15px}
.year-label{color:#a9caff;font-size:11px;font-weight:800;letter-spacing:2px}
.year-age{font-size:64px;font-weight:950;margin:8px 0 0}
.year-age-caption{color:#a8b8d0;font-size:13px}
.year-divider{width:48px;height:3px;background:var(--blue);border-radius:5px;margin:17px auto}
.year-description{color:#c5d2e5;font-size:13px;line-height:1.5}
.year-section-title{font-size:15px;font-weight:900;margin:19px 0 11px}
.year-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.year-stat{background:linear-gradient(145deg,#17243a,#111a2b);border:1px solid var(--border);border-radius:15px;padding:14px;min-height:90px}
.year-stat-top{display:flex;align-items:center;gap:8px}
.year-stat-icon{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:#233653;font-size:15px}
.year-stat-name{font-size:11px;color:var(--muted)}
.year-stat-value{font-size:19px;font-weight:900;margin-top:9px}
.delta{font-size:11px;font-weight:800;margin-top:4px}
.delta.up{color:var(--green)}.delta.down{color:var(--red)}.delta.same{color:var(--muted)}
.year-footer{text-align:center;color:var(--muted);font-size:11px;line-height:1.5;margin:15px 5px}
.year-continue{padding:16px;font-size:14px}
.year-history{background:#17253c;border:1px solid #2b4264;border-radius:14px;padding:13px;margin-top:13px;font-size:12px;line-height:1.55;color:#c0cee3}

.business-type{background:#121e31;border:1px solid var(--border);border-radius:15px;padding:14px;margin-bottom:10px}
.business-type .emoji{font-size:27px;margin-bottom:9px}
.business-action{background:#17243a;border:1px solid var(--border);border-radius:14px;padding:13px;margin-bottom:9px}

</head>

let state=null,currentTab="home",pendingEvent=null,toastTimer=null,lastYearSummary=null;

function save(){if(state)localStorage.setItem(KEY,JSON.stringify(state))}
function load(){
try{
const old=JSON.parse(localStorage.getItem(KEY));
if(!old||typeof old!=="object")return null;
return {...defaultState(),...old,history:Array.isArray(old.history)?old.history:[]}
}catch(e){return null}
}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function clamp(n,min=0,max=100){return Math.max(min,Math.min(max,Number(n)||0))}
function money(n){return Math.round(n).toLocaleString("ru-RU")+" ₽"}
function log(text){state.history.unshift({age:state.age,text});if(state.history.length>100)state.history.length=100}
function bar(v,max=100){return`<div class="progress"><div style="width:${clamp(v,0,max)/max*100}%"></div></div>`}
function statCard(name,value){return`<div class="stat"><div class="name">${name}</div><div class="value">${value}</div></div>`}
function notify(message,title="Уведомление",icon="ℹ️"){
document.getElementById("toastTitle").textContent=title;
document.getElementById("toastMessage").textContent=message;
document.getElementById("toastIcon").textContent=icon;
document.getElementById("toastWrap").classList.add("show");
clearTimeout(toastTimer);toastTimer=setTimeout(hideToast,4500)
}
function hideToast(){document.getElementById("toastWrap").classList.remove("show")}
function closeToast(e){if(e.target.id==="toastWrap")hideToast()}

function requirementRows(name){

/* Рабочие задания */
function getProfessionCategory(name){
return Object.keys(categories).find(c=>categories[c].includes(name))||"Общество";
}
function getTasksForProfession(name){
const category=getProfessionCategory(name);
const templates=taskTemplates[category]||taskTemplates["Общество"];
const special=taskSpecific[name];
return templates.map((t,i)=>({
title:special?.[i]||t.title,
description:t.description,
difficulty:t.difficulty+i*3
}));
}
function jobTasksScreen(){
const name=state.career;
if(!importantProfessions.includes(name))return"";
const done=state.jobTaskYear===state.year;
const tasks=getTasksForProfession(name);
const monthly=careerLevels[state.careerLevel].salary;
return`<div class="card" style="border-color:#31517c">
<div class="row"><h3 style="margin:0">⭐ Рабочие задания</h3><span class="tag gold">Особая работа</span></div>
<p class="item-desc">В твоей профессии доступны дополнительные ответственные задачи. За их выполнение можно получить премию, опыт и репутацию.</p>
${done?`<div class="notice">В этом году ты уже выполнил рабочее задание. Новые задания появятся после перехода к следующему году.</div>`:
tasks.map((t,i)=>{
const reward=Math.round(monthly*(.55+i*.2)*(1+state.careerLevel*.08));
const skillNeed=Math.max(15,t.difficulty+state.careerLevel*2);
const experienceNeed=Math.max(0,Math.floor(t.difficulty/12)-1);
return`<div class="job-task">
<h4>${esc(t.title)}</h4>
<p>${esc(t.description)}</p>
<div class="row"><span class="small muted">Сложность</span><b>${t.difficulty}/100</b></div>
<div class="row" style="margin-top:6px"><span class="small muted">Навыки</span><b>${skillNeed}</b></div>
<div class="row" style="margin-top:6px"><span class="small muted">Опыт</span><b>${experienceNeed} лет</b></div>
<div class="row" style="margin-top:6px"><span class="small muted">Премия</span><b style="color:var(--green)">${money(reward)}</b></div>
<button class="secondary full" style="margin-top:10px" onclick="completeJobTask(${i})">Выполнить задание</button>
</div>`
}).join("")}
<div class="small muted">Задание расходует одно действие из пяти доступных за год.</div>
</div>`;
}
function completeJobTask(index){
if(!state.career||!importantProfessions.includes(state.career))return;
if(state.jobTaskYear===state.year){notify("В этом году ты уже выполнял рабочее задание.","Задание выполнено","⭐");return}
const tasks=getTasksForProfession(state.career);
const task=tasks[index];if(!task)return;
if(state.actionsThisYear>=5){notify("На этот год действий больше не осталось.","Лимит исчерпан","⏳");return}
const skillNeed=Math.max(15,task.difficulty+state.careerLevel*2);
const experienceNeed=Math.max(0,Math.floor(task.difficulty/12)-1);
if(state.skills<skillNeed){notify("Для задания нужно "+skillNeed+" навыков. Сейчас у тебя "+state.skills+".","Не хватает навыков","⚡");return}
if(state.careerYears<experienceNeed){notify("Для задания требуется "+experienceNeed+" лет опыта работы.","Не хватает опыта","💼");return}
if(!spendAction())return;
state.jobTaskYear=state.year;
const monthly=careerLevels[state.careerLevel].salary;
const reward=Math.round(monthly*(.55+index*.2)*(1+state.careerLevel*.08));
const chance=clamp(65+(state.skills-skillNeed)*.5+state.careerLevel*3+state.reputation*.15-task.difficulty*.25,20,97);
if(Math.random()*100<chance){
state.money+=reward;
state.skills=clamp(state.skills+2);
state.reputation=clamp(state.reputation+3);
state.influence=clamp(state.influence+1);
state.jobTaskDone++;
log("Ты успешно выполнил рабочее задание «"+task.title+"» и получил премию "+money(reward)+".");
save();render();notify("Задание выполнено! Премия: "+money(reward)+". Навыки и репутация выросли.","Отличная работа","🏆")
}else{
state.reputation=clamp(state.reputation-1);
state.skills=clamp(state.skills+1);
log("Ты не справился с заданием «"+task.title+"». Получен полезный опыт, но результат оказался недостаточным.");
save();render();notify("Задание не удалось выполнить полностью. Ты получил опыт, но премия не начислена.","Задание не выполнено","⚠️")
}
}

function setAmbition(value){
if(!categories[value])return;
state.ambition=value;state.goal="Развиваться в сфере: "+value;
log("Ты выбрал направление: "+value+".");save();render()
}
function clearAmbition(){state.ambition="";state.goal="";state.pendingApplication=false;state.selectedProfession="";save();render()}
function spendAction(){
if(state.actionsThisYear>=5){notify("На этот год действий больше не осталось.","Лимит исчерпан","⏳");return false}
state.actionsThisYear++;return true
}
function finishAction(message){log(message);save();render()}
function doAction(i){actionList[i][2]()}
function study(){if(!spendAction())return;state.skills+=2;state.studyProgress+=10;if(state.studyProgress>=100){state.studyProgress=0;state.education++}finishAction("Ты посвятил время учёбе. Знания постепенно растут.")}
function train(){if(!spendAction())return;state.skills+=3;state.health=clamp(state.health-2);finishAction("Ты развивал навыки и получал практический опыт.")}
function work(){
if(state.age<14){notify("Сейчас можно готовиться только к будущей профессии.","Пока рано работать","🎓");return}
if(!spendAction())return;
const income=state.age<18?3000:10000+state.skills*150;
state.money+=income;state.skills++;state.reputation++;
finishAction("Ты поработал и заработал "+money(income)+".")
}
function rest(){if(!spendAction())return;state.health=clamp(state.health+12);finishAction("Ты отдохнул и восстановил силы.")}
function socialize(){if(!spendAction())return;state.relations=clamp(state.relations+5);state.friends++;state.connections=clamp(state.connections+2);finishAction("Ты провёл время с людьми и расширил круг общения.")}
function hobby(){if(!spendAction())return;state.skills++;state.health=clamp(state.health+3);finishAction("Ты занимался любимым делом.")}
function helpFamily(){if(!spendAction())return;const cost=Math.min(3000,state.money);state.money-=cost;state.relations=clamp(state.relations+4);state.familySupport+=2;finishAction("Ты помог близким. Отношения стали немного крепче.")}
function goalWork(){
if(!state.goal){notify("Сначала выбери жизненную цель в разделе «Карьера».","Нет цели","🎯");return}
if(!spendAction())return;
state.skills+=2;state.reputation++;
if(state.ambition)state.influence=clamp(state.influence+1);
finishAction("Ты сделал ещё один шаг к своей цели: "+state.goal+".")
}

}

function professionInInstrumental(name){return professionForms[name]||name+"ом"}
function chooseCareer(i){
const p=categories[state.ambition]?.[i];if(!p)return;
chooseCareerByName(p)
}
function chooseCareerByName(p){
if(state.career){notify("Сначала заверши текущую карьеру или уволись.","У тебя уже есть работа","💼");return}
if(!categories[state.ambition]?.includes(p))return;
state.selectedProfession=p;
state.goal="Стать "+professionInInstrumental(p).toLowerCase();
state.pendingApplication=true;
log("Ты поставил перед собой цель: "+state.goal+". Теперь нужно подготовиться и получить первую должность.");
save();render();
if(state.age<18)notify("Сейчас можно готовиться к будущей профессии. С 18 лет сможешь подать заявку.","Пока рано работать","🎓");
else notify("Цель установлена. Изучи требования и подай заявку, когда будешь готов.","Новая цель","🎯")
}
function applyForJob(){
if(!state.pendingApplication||!state.selectedProfession){notify("Сначала выбери профессию.","Нет цели","⚠️");return}
if(state.age<18){notify("Полноценная карьера начинается с 18 лет.","Пока рано","🎓");return}
const r=professionRequirements(state.selectedProfession);
if(state.age<r.age){notify("Для этой профессии нужен возраст от "+r.age+" лет.","Пока рано","🎓");return}
if(state.education<r.education){notify("Недостаточно образования. Требуется: "+educationNames[r.education]+".","Нужно образование","📚");return}
if(state.skills<r.skills){notify("Нужно больше навыков. Требуется: "+r.skills+". Сейчас: "+state.skills+".","Нужно развиваться","⚡");return}
if(state.reputation<r.reputation){notify("Для этой профессии нужна репутация "+r.reputation+". Сейчас: "+state.reputation+".","Нужна репутация","⭐");return}
state.jobApplications++;
const chance=clamp(45+state.reputation/2+state.connections/5+state.influence/8,20,90);
if(Math.random()*100<chance){
state.career=state.selectedProfession;state.careerLevel=0;state.careerYears=0;state.employed=true;state.pendingApplication=false;
log("Тебя приняли на первую должность: "+state.career+".");
notify("Заявка одобрена! Ты получил первую должность.","Тебя приняли","🎉")
}else{
state.reputation=clamp(state.reputation-1);
log("Твою заявку на работу отклонили. Нужно улучшить подготовку и попробовать снова.");
notify("Заявку отклонили. Продолжай развиваться и попробуй позже.","Отказ в работе","📄")
}
save();render()
}
function applyPromotion(){
if(!state.career||!state.employed)return;
if(state.careerLevel>=9){notify("Ты достиг максимальной ступени этой карьерной системы.","Максимальный уровень","🏆");return}
const next=careerLevels[state.careerLevel+1];
const years=next.years,skills=15+(state.careerLevel+1)*8,rep=5+(state.careerLevel+1)*7;
const influence=state.careerLevel>=5?10+(state.careerLevel-4)*10:0;
if(state.careerYears<years||state.skills<skills||state.reputation<rep||state.influence<influence){
notify("Для повышения пока недостаточно достижений. Нужно: опыт "+years+" лет, навыки "+skills+", репутация "+rep+", влияние "+influence+".","Повышение пока недоступно","📈");return
}
state.careerLevel++;state.reputation=clamp(state.reputation+3);state.influence=clamp(state.influence+2);
log("Ты получил повышение: "+next.name+".");save();render();notify("Ты получил новую должность: "+next.name+".","Повышение","🏆")
}
function quitJob(){
if(!state.career||!state.employed)return;
if(!confirm("Уволиться с текущей работы?"))return;
log("Ты ушёл с должности: "+state.career+".");
state.career=null;state.careerLevel=0;state.careerYears=0;state.employed=false;
state.selectedProfession="";state.pendingApplication=false;save();render()
}

/* БИЗНЕС — операции */
function openBusiness(i){
if(state.age<18){notify("Открыть бизнес можно с 18 лет.","Пока рано","🎓");return}
const type=businessTypes[i];if(!type)return;
if(state.business){notify("У тебя уже есть компания.","Бизнес существует","🏢");return}
if(state.money<type.cost){notify("Не хватает денег. Нужно ещё "+money(type.cost-state.money)+".","Недостаточно средств","💰");return}
const name=prompt("Придумай название своей компании:",state.name+" Group");
if(name===null)return;
if(!name.trim()){notify("Название компании не может быть пустым.","Нужно название","⚠️");return}
state.money-=type.cost;
state.business={
type:type.id,name:name.trim().slice(0,35),level:0,
cash:0,staff:0,reputation:10,health:85,marketing:0,
risk:type.risk,invested:type.cost,value:Math.round(type.cost*1.1),
lastRevenue:0,lastExpenses:0,lastProfit:0,pendingBonus:0,
years:0,totalProfit:0
};
log("Ты открыл собственный бизнес: "+name.trim()+". Началось развитие компании.");
save();render();notify("Компания открыта! Теперь ты предприниматель.","Бизнес создан","🏢")
}
function businessUpgradeCost(){return Math.round(50000*(state.business.level+1)*1.55)}
function upgradeBusiness(){
const b=state.business;if(!b)return;
const cost=businessUpgradeCost();
if(state.actionsThisYear>=5){notify("На этот год действий больше не осталось.","Лимит исчерпан","⏳");return}
if(state.money<cost){notify("Не хватает личных денег для улучшения. Нужно "+money(cost)+".","Недостаточно средств","💰");return}
if(b.level>=5){notify("Компания уже достигла максимального уровня развития.","Максимальный уровень","🏆");return}
if(!spendAction())return;
state.money-=cost;b.level++;b.health=clamp(b.health+12);b.value+=Math.round(cost*1.4);b.risk=Math.max(5,b.risk-2);
log("Ты вложил "+money(cost)+" в развитие компании. Уровень бизнеса повышен.");
save();render();notify("Компания стала сильнее. Её потенциальная прибыль выросла.","Развитие бизнеса","🏗️")
}
function advertiseBusiness(){
const b=state.business;if(!b)return;
if(state.actionsThisYear>=5){notify("На этот год действий больше не осталось.","Лимит исчерпан","⏳");return}
if(state.money<15000){notify("Для рекламы нужно 15 000 ₽ личных денег.","Недостаточно средств","💰");return}
if(!spendAction())return;
state.money-=15000;b.marketing=clamp(b.marketing+18);b.reputation=clamp(b.reputation+3);b.value+=5000;

save();render();notify("Реклама запущена. Узнаваемость компании выросла.","Реклама","📢")
}
function hireEmployee(){

function businessContract(){
const b=state.business;if(!b)return;
if(state.actionsThisYear>=5){notify("На этот год действий больше не осталось.","Лимит исчерпан","⏳");return}
if(state.money<5000){notify("Для участия в конкурсе на контракт нужно 5 000 ₽.","Недостаточно средств","💰");return}
if(!spendAction())return;
state.money-=5000;
const chance=clamp(25+b.reputation*.35+state.skills*.25+state.connections*.2+b.level*5,15,85);
if(Math.random()*100<chance){

log("Компания получила контракт на "+money(reward)+". Выплата поступит в конце года.");
notify("Контракт получен! "+money(reward)+" будет зачислено бизнесу в конце года.","Успешный контракт","🤝")

notify("Контракт достался конкурентам. Попробуй ещё раз в следующем году.","Контракт не получен","📄")

function investBusiness(){
const b=state.business;if(!b)return;
const amount=Number(prompt("Сколько личных денег вложить в компанию?"));
if(!Number.isFinite(amount)||amount<=0)return;
if(!Number.isInteger(amount)){notify("Введи целое число.","Неверная сумма","⚠️");return}
if(amount>state.money){notify("У тебя недостаточно личных денег.","Недостаточно средств","💰");return}
if(!spendAction())return;
state.money-=amount;b.cash+=amount;b.invested+=amount;b.value+=Math.round(amount*.7);
b.health=clamp(b.health+Math.min(10,amount/50000));
log("Ты вложил "+money(amount)+" личных денег в компанию.");
save();render();notify("Деньги переведены в бизнес.","Инвестиция","💰")
}
function withdrawBusiness(){
const b=state.business;if(!b)return;
const amount=Number(prompt("Сколько денег вывести из бизнеса? Доступно: "+money(b.cash)));
if(!Number.isFinite(amount)||amount<=0)return;
if(!Number.isInteger(amount)){notify("Введи целое число.","Неверная сумма","⚠️");return}
if(amount>b.cash){notify("В компании нет такой суммы.","Недостаточно средств","💰");return}
if(!spendAction())return;
b.cash-=amount;state.money+=amount;b.value=Math.max(0,b.value-Math.round(amount*.5));
log("Ты вывел "+money(amount)+" из бизнеса в личные деньги.");
save();render();notify("Деньги переведены на личный счёт.","Вывод средств","💰")
}
function sellBusiness(){
const b=state.business;if(!b)return;
const estimate=Math.max(0,Math.round(b.value*(.65+b.health/300+b.reputation/500)));
if(!confirm("Продать компанию примерно за "+money(estimate)+"? Деньги поступят на личный счёт."))return;
state.money+=estimate+b.cash;
log("Ты продал компанию за "+money(estimate)+".");
state.business=null;save();render();notify("Компания продана. Деньги получены.","Бизнес продан","💰")
}
function closeBusiness(){
const b=state.business;if(!b)return;
const refund=Math.round(b.cash+b.value*.15);
if(!confirm("Закрыть компанию? Ты получишь примерно "+money(refund)+". Большая часть вложений будет потеряна."))return;
state.money+=refund;log("Ты закрыл свой бизнес. Получено "+money(refund)+".");
state.business=null;save();render();notify("Компания закрыта.","Бизнес закрыт","🏢")
}

/* Годовая экономика бизнеса */
function calculateBusinessYear(){
const b=state.business;if(!b)return;
const type=businessTypes.find(x=>x.id===b.type);
if(!type)return;
const levelMultiplier=1+b.level*.42;
const staffMultiplier=1+b.staff*.055;
const reputationMultiplier=.65+b.reputation/200;
const healthMultiplier=.5+b.health/200;
const marketingMultiplier=1+b.marketing/250;
const randomMultiplier=.82+Math.random()*.36;
let revenue=Math.round(type.base*levelMultiplier*staffMultiplier*reputationMultiplier*healthMultiplier*marketingMultiplier*randomMultiplier);
revenue+=b.pendingBonus;
const baseExpenses=Math.round(type.base*.48*(1+b.level*.25));
const staffExpenses=b.staff*18000;
const marketingExpenses=Math.round(type.base*b.marketing/500);
const maintenance=Math.round(type.base*(100-b.health)/500);
let expenses=baseExpenses+staffExpenses+marketingExpenses+maintenance;
let profit=revenue-expenses;
b.lastRevenue=revenue;b.lastExpenses=expenses;b.lastProfit=profit;
b.cash+=profit;b.totalProfit+=profit;b.years++;
b.pendingBonus=0;
b.marketing=Math.max(0,b.marketing-7);
b.health=clamp(b.health-(b.staff>5?2:1)+1);
b.value=Math.max(0,Math.round(b.value+profit*.45+revenue*.08));
if(profit<0){
b.risk=clamp(b.risk+3);
b.reputation=clamp(b.reputation-2);
log("Бизнес завершил год с убытком: "+money(Math.abs(profit))+".");
}else{
b.risk=clamp(b.risk-1);
b.reputation=clamp(b.reputation+1);
log("Бизнес принёс прибыль: "+money(profit)+". Доход компании: "+money(revenue)+", расходы: "+money(expenses)+".");
}
if(b.cash<0){
const debt=Math.abs(b.cash);
b.cash=0;b.health=clamp(b.health-10);b.value=Math.max(0,b.value-debt);
log("У компании возникли финансовые трудности. Состояние бизнеса ухудшилось.");
}
if(b.health<=15){
b.reputation=clamp(b.reputation-3);
log("Компания находится в тяжёлом состоянии. Ей нужны вложения и управление.");
}
}

/* Годовой итог */
function deltaText(a,b,isMoney=false){
const d=b-a;if(d===0)return'<div class="delta same">Без изменений</div>';
const sign=d>0?"+":"−",value=isMoney?money(Math.abs(d)):Math.abs(d);
return`<div class="delta ${d>0?"up":"down"}">${sign}${value}</div>`
}
function yearStat(icon,name,before,after,isMoney=false){
return`<div class="year-stat"><div class="year-stat-top"><div class="year-stat-icon">${icon}</div><div class="year-stat-name">${name}</div></div><div class="year-stat-value">${isMoney?money(after):after}</div>${deltaText(before,after,isMoney)}</div>`
}
function showYearSummary(summary){
const yearsText=summary.age===1?"год":summary.age>=2&&summary.age<=4?"года":"лет";
app.innerHTML=`<div class="year-screen">
<div class="year-hero"><div class="year-label">LIFE PATH · ИТОГИ ГОДА</div>
<div class="year-age">${summary.age}</div><div class="year-age-caption">${yearsText}</div>
<div class="year-divider"></div>
<div class="year-description">${esc(state.name)}, ещё один год твоей жизни позади.<br>Посмотри, как изменился твой путь.</div></div>
<div class="year-section-title">📊 Изменения за год</div>
<div class="year-stats">
${yearStat("💰","Деньги",summary.before.money,summary.after.money,true)}
${yearStat("❤️","Здоровье",summary.before.health,summary.after.health)}
${yearStat("🤝","Отношения",summary.before.relations,summary.after.relations)}
${yearStat("🎓","Образование",summary.before.education,summary.after.education)}
${yearStat("⚡","Навыки",summary.before.skills,summary.after.skills)}
${yearStat("⭐","Репутация",summary.before.reputation,summary.after.reputation)}
</div>
${summary.business?`<div class="year-history"><b>🏢 Итоги бизнеса</b><br>Доход: ${money(summary.business.revenue)}<br>Расходы: ${money(summary.business.expenses)}<br>Результат: ${summary.business.profit>=0?"+":"−"}${money(Math.abs(summary.business.profit))}</div>`:""}
<div class="year-history"><b>📅 Год ${summary.year}</b><br>
${summary.age<6?"Ты растёшь, знакомишься с окружающим миром и постепенно готовишься к новым этапам жизни.":summary.age<18?"Ты взрослеешь, получаешь знания и постепенно определяешь своё будущее.":"Ты продолжаешь строить свою жизнь, принимать решения и двигаться к поставленным целям."}</div>
<div class="year-footer">Каждый год меняет твою историю. Следующий выбор — за тобой.</div>
<button class="primary full year-continue" onclick="continueAfterYear()">Продолжить →</button>
</div>`;
app.classList.remove("page-enter");void app.offsetWidth;app.classList.add("year-screen")
}

/* Переход на следующий год */
function nextYear(){
if(!confirm("Прожить следующий год? Текущий год завершится."))return;
const before={
money:state.money,health:state.health,relations:state.relations,
education:state.education,skills:state.skills,reputation:state.reputation
};
state.age++;state.year++;state.actionsThisYear=0;

if(state.age===6&&state.educationStage==="Не начато"){
state.educationStage="Школьник";log("Ты пошёл в школу.")
}
if(state.age>=6&&state.age<=17&&state.educationStage==="Школьник"){
state.studyYears++;
if(state.studyYears%2===0)state.education++;
if(state.age===17){
state.educationStage="Среднее образование";
state.education=Math.max(state.education,1);
log("Ты завершил школьный этап.")
}
}
if(state.institution){
state.studyYears++;
const duration=state.institution==="Университет"?5:state.institution==="Колледж"?3:state.institution==="Магистратура"?2:3;
if(state.studyYears>=duration){
state.education++;state.educationStage=state.institution+" — завершено";
log("Ты завершил обучение: "+state.institution+".");
state.institution="";state.studyYears=0
}
}
if(state.career&&state.employed&&state.age>=18){
state.careerYears++;
const salary=careerLevels[state.careerLevel].salary*12;
state.money+=salary;
log("Ты получил годовой доход от работы: "+money(salary)+".");
if(Math.random()<.08){state.reputation=clamp(state.reputation+2);state.influence=clamp(state.influence+1);log("Твои результаты заметили. Репутация немного выросла.")}
}
const businessBefore=state.business?{...state.business}:null;
if(state.business)calculateBusinessYear();

if(state.age>=18){
const expenses=state.partner?18000:10000;
state.money-=expenses*12;
log("Расходы на жизнь за год составили "+money(expenses*12)+".")
}
state.money=Math.max(0,state.money);
state.health=clamp(state.health-(state.age>=18?2:1));
state.relations=clamp(state.relations-1);

if(state.age>=18&&state.money===0&&Math.random()<.35){
state.health=clamp(state.health-3);state.reputation=clamp(state.reputation-1);
log("Из-за нехватки денег пришлось отказаться от части планов.")
}
if(state.age>=18&&state.career&&state.employed&&Math.random()<.04){
state.employed=false;state.reputation=clamp(state.reputation-2);
log("Ты потерял работу. Теперь нужно искать новую возможность.")
}

pendingEvent=null;
const availableEvents=events.filter(event=>{
if(state.age<(event.minAge||0))return false;
if(event.requiresJob&&(!state.employed||!state.career))return false;
if(event.requiresBusiness&&!state.business)return false;
return true
});
if(availableEvents.length&&Math.random()<=.48){
pendingEvent=availableEvents[Math.floor(Math.random()*availableEvents.length)]
}
lastYearSummary={
age:state.age,year:state.year,before,
after:{
money:state.money,health:state.health,relations:state.relations,
education:state.education,skills:state.skills,reputation:state.reputation
},
business:businessBefore&&state.business?{
revenue:state.business.lastRevenue,
expenses:state.business.lastExpenses,
profit:state.business.lastProfit
}:null
};
save();showYearSummary(lastYearSummary)
}
function continueAfterYear(){if(pendingEvent)showRandomEvent();else showTab("home")}
function showRandomEvent(){
if(!pendingEvent){showTab("home");return}
app.innerHTML=`<div class="section-title">Событие твоей жизни</div>
<div class="event"><div class="item-title">${esc(pendingEvent.title)}</div>
<p class="item-desc">${esc(pendingEvent.text)}</p>
<div class="choice">${pendingEvent.options.map((o,i)=>`<button class="secondary" onclick="chooseEvent(${i})">${esc(o[0])}</button>`).join("")}</div></div>
<div class="notice">Возраст: ${state.age} лет. Твой выбор повлияет на дальнейшую историю.</div>`;
app.classList.remove("page-enter");void app.offsetWidth;app.classList.add("page-enter")
}
function chooseEvent(i){
if(!pendingEvent)return;
pendingEvent.options[i][1](state);
["health","relations","reputation","influence","connections"].forEach(k=>{state[k]=clamp(state[k])});
state.money=Math.max(0,state.money);
if(state.business){
state.business.health=clamp(state.business.health);
state.business.reputation=clamp(state.business.reputation);
state.business.staff=Math.max(0,state.business.staff)
}
log("Событие: "+pendingEvent.title+". Решение: "+pendingEvent.options[i][0]+".");
pendingEvent=null;save();showTab("home")
}
function newLife(){
if(!confirm("Начать новую жизнь? Текущее сохранение будет удалено."))return;
localStorage.removeItem(KEY);state=null;pendingEvent=null;lastYearSummary=null;createScreen()
}

/* Загрузка сохранения */
state=load();
if(state){
if(!state.name)state.name="Персонаж";
if(!state.surname)state.surname="Не указана";
if(state.age<18&&state.employed){
state.employed=false;state.career=null;state.careerLevel=0;state.careerYears=0;
log("Исправление сохранения: взрослая должность недоступна до 18 лет.")
}
if(!state.career)state.employed=false;
if(state.business){
const defaults={
cash:0,staff:0,reputation:10,health:85,marketing:0,risk:10,
invested:0,value:0,lastRevenue:0,lastExpenses:0,lastProfit:0,
pendingBonus:0,years:0,totalProfit:0,level:0
};
state.business={...defaults,...state.business}
}
if(state.career&&!state.selectedProfession)state.selectedProfession=state.career;
save();nav.classList.remove("hidden");render()
}else{
createScreen()
}
</script>
</body>
</html>
